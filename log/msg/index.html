<script>
(function () {
  try {
    const saved = localStorage.getItem("theme");
    document.documentElement.dataset.theme =
      saved === "light" || saved === "dark" ? saved : "light";
  } catch (e) {
    document.documentElement.dataset.theme = "light";
  }
})();
</script>

 <div id="siteHeader" data-include="/assets/header.html"></div>

  <main class="page-enter">
    
    <section class="card">
      
         <!-- <h2>comment</h2> -->
      <p style="font-size: smaller;">
        お返事不要の場合は本文末に｢×｣の記載をお願いします。
      </p>
      
      <form action="https://ssl.form-mailer.jp/fm/service/Forms/complete"
        method="post"
        accept-charset="UTF-8"
        class="message-form">

        <input type="hidden" name="key" value="de7d453a878187">
        <input type="hidden" name="code" value="utf8">

        <!-- log情報 -->
        <input type="hidden" id="entry_date" name="entry_date">
        <input type="hidden" id="entry_tags" name="entry_tags">

          <!-- <input type="hidden" name="next" value="https://moonuit.vercel.app/log/"> -->
        <label>name</label>
        <input name="field_7683582" type="text">

        <label>message*</label>
        <textarea name="field_7683584" rows="12" required></textarea>

        <div style="display:none;">
          <textarea id="log_info" name="field_7684327" cols="30" rows="3"></textarea>
        </div>

        <button type="submit">send</button>

        </form>
      </section>
      
<script>
(function(){

  // URLパラメータ取得
  const params = new URLSearchParams(window.location.search);

  const entryDate = params.get("entry_date");
  const entryTags = params.get("entry_tags");

  // textarea取得
  const logInfoField = document.querySelector('[name="field_7684327"]');

  if(!logInfoField) return;

  let text = "";

  if(entryDate){
    text += "log date : " + entryDate;
  }

  if(entryTags){
    if(text) text += "\n";
    text += "tags : " + entryTags;
  }

  // 入力
  logInfoField.value = text;

})();
</script>
