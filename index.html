 <script>
  const aboutBox = document.querySelector(".about-box");
  const summary = aboutBox.querySelector("summary");

  const OFFSET = 20; // ← ここで余白調整（70〜120くらいで好み）

  summary.addEventListener("click", (e) => {
    e.preventDefault();

    const wasOpen = aboutBox.open;
    aboutBox.open = !wasOpen;

    if (!wasOpen) {
      requestAnimationFrame(() => {
        const y = aboutBox.getBoundingClientRect().top + window.scrollY - OFFSET;
        window.scrollTo({ top: y, behavior: "smooth" });
      });
    }
  });
</script>
<script>
(() => {
  const HEADER_OFFSET = 20; // 固定ヘッダーがなければ 0〜30でもOK

  function openDetailsInTarget(target) {
    if (!target) return;

    if (target.matches?.("details")) {
      target.open = true;
      return;
    }

    const nested = target.querySelector?.("details");
    if (nested) {
      nested.open = true;
      return;
    }

    const closestDetails = target.closest?.("details");
    if (closestDetails) closestDetails.open = true;
  }

  function scrollToTarget(target) {
    const y = target.getBoundingClientRect().top + window.scrollY - HEADER_OFFSET;
    window.scrollTo({ top: y, behavior: "smooth" });
  }

  function handleHash(hash) {
    if (!hash) return;
    const target = document.querySelector(hash);
    if (!target) return;

    openDetailsInTarget(target);

    // レイアウト確定後にスクロール（ズレ防止）
    requestAnimationFrame(() => {
      scrollToTarget(target);

      // さらに微ズレ補正（開閉アニメ/フォントでズレる保険）
      setTimeout(() => scrollToTarget(target), 120);
    });
  }

  document.addEventListener("click", (e) => {
    const link = e.target.closest?.('a[href^="#"]');
    if (!link) return;

    const hash = link.getAttribute("href");
    if (!hash || hash === "#") return;

    const target = document.querySelector(hash);
    if (!target) return;

    e.preventDefault();
    handleHash(hash);
    history.replaceState(null, "", location.pathname + location.search);
  });

  window.addEventListener("load", () => {
    if (!location.hash) return;

    const hash = location.hash;
    const target = document.querySelector(hash);
    if (!target) return;

    handleHash(hash);

    setTimeout(() => {
      history.replaceState(null, "", location.pathname + location.search);
    }, 500);
  });
})();
</script>

<script>
document.querySelectorAll('.copy-url').forEach(el => {

    const url = el.dataset.url;
    navigator.clipboard.writeText(url);
    el.textContent = "copied!";
    setTimeout(() => {
      el.textContent = "sunjour";
    }, 2000);
  });
});
