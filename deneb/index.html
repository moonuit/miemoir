 <script>
/* ===== 総文字数カウント ===== */
async function fetchMdText(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) return null;
  return await res.text();
}

function countCharsFromMd(md) {
  if (!md) return 0;

  const titleMatch = md.match(/^\s*#\s+(.+)\s*$/m);
  if (titleMatch) {
    md = md.replace(titleMatch[0], "");
    md = md.replace(/^\s*\n/, "");
  }

  let t = md
    .replace(/```[\s\S]*?```/g, "")
    .replace(/`[^`]*`/g, "")
    .replace(/!\[[^\]]*\]\([^)]+\)/g, "")
    .replace(/\[[^\]]*\]\([^)]+\)/g, "")
    .replace(/[#>*_\-~]/g, "");

  t = t
    .replace(/\r\n/g, "\n")
    .replace(/[ \t\u3000]/g, "")
    .replace(/\n+/g, "");

  return t.length;
}

async function calcTotalChars({ maxEp, mdBase = "./ep/md", outId = "totalChars" } = {}) {
  const out = document.getElementById(outId);
  if (out) out.textContent = "calculating…";

  const paths = [];
  for (let i = 0; i <= maxEp; i++) {
    const ep2 = String(i).padStart(2, "0");
    paths.push(`${mdBase}/${ep2}.md`);
  }

  const texts = await Promise.all(paths.map(fetchMdText));
  const total = texts.reduce((sum, md) => sum + countCharsFromMd(md), 0);

  if (out) out.textContent = `total characters: ${total.toLocaleString()}`;
  return total;
}

/* ===== トップページ処理 ===== */
document.addEventListener("DOMContentLoaded", () => {
  const NOVEL_ID = "deneb";
  const KEY = `bookmark_${NOVEL_ID}`;
  const MAX_EP = 34;

  const SECTIONS = [
    { id: "nav-99", start: 0,  end: 0 },
    { id: "nav-0", start: 1,  end: 7 },
    { id: "nav-1", start: 8,  end: 30 },
    { id: "nav-2", start: 31,  end: MAX_EP }
  ];

  // ブックマーク読み込み
  let bookmarks = [];
  try { bookmarks = JSON.parse(localStorage.getItem(KEY) || "[]").map(String); }
  catch { bookmarks = []; }

  const normalizeEp = (ep) => {
    const n = Number(ep);
    if (!Number.isFinite(n) || n < 0) return null;
    return String(n).padStart(2, "0");
  };
  const bookmarkSet = new Set(bookmarks.map(normalizeEp).filter(Boolean));

  const makeBtn = (ep2) => {
    const a = document.createElement("a");
    a.className = "btn episode-link";
    a.href = `ep/?ep=${ep2}`;
    a.dataset.ep = `${NOVEL_ID}-${ep2}`;
    a.textContent = ep2;
    if (bookmarkSet.has(ep2)) a.classList.add("is-bookmark");
    return a;
  };

  const renderRange = (containerId, start, end) => {
    const el = document.getElementById(containerId);
    if (!el) return;

    const safeStart = Math.max(0, start);
    const safeEnd = Math.min(end, MAX_EP);
    if (safeEnd < safeStart) return;

    el.innerHTML = "";
    for (let i = safeStart; i <= safeEnd; i++) {
      const ep2 = String(i).padStart(2, "0");
      el.appendChild(makeBtn(ep2));
    }
  };

  // 章ごとに描画（1回だけ）
  SECTIONS.forEach(s => renderRange(s.id, s.start, s.end));

  // 総文字数（描画とは独立）
  calcTotalChars({
    maxEp: MAX_EP,
    mdBase: "./ep/md",
    outId: "totalChars"
  });
});
</script>
