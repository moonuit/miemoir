<style>
  .landing-wrap {
  text-align: center;
}

.about-box{

.enter-btn{
  display:flex;
  justify-content: space-between;
  align-items:center;
  width:min(340px, 95%);

.links-sub{

.cover__btn{

  display: flex;
  flex-direction: column;   /* ← 縦並び */

}

.cover__btn::before {

}

.cover__btn::after{
  content: "\f282"; /* bi-chevron-down */
  font-family: "bootstrap-icons";
  font-size: 1rem;
  transition: transform .3s ease;
  opacity: 0.8;
}

details[open] > .cover__btn::after {
  transform: rotate(180deg);
}

.cover__btn::after{
  margin-top: 4px;
}

.cover__btn:hover::after {
  transform: translateY(2px);
}

.enter-btn .left{

  letter-spacing:0.03em;
}

.enter-btn .right{
