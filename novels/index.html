    document.getElementById('update-list').innerHTML = marked.parse(md);

    console.error(err);
    document.getElementById('update-list').innerHTML = '<p>更新履歴を読み込めませんでした。</p>';
  }
}

loadUpdates();

<script>
/*
  =========================================
  hashで飛んだときに
  ・対象セクションまでヘッダーオフセット付きでスクロール
  ・そのセクション内の <details> を自動で開く
  ・URLの # は残さない（replaceState）
  =========================================
*/
(() => {
  const HEADER_OFFSET = 70;

  function openDetailsInTarget(target) {
    if (!target) return;

    // 1) hash対象が <details> ならそれを開く
    if (target.matches && target.matches("details")) {
      target.open = true;
      return;
    }

    // 2) hash対象の中に <details> があればそれを開く
    const nested = target.querySelector ? target.querySelector("details") : null;
    if (nested) {
      nested.open = true;
      return;
    }

    // 3) hash対象が section等で、近くに <details> があるケース（保険）
    const closestDetails = target.closest ? target.closest("details") : null;
    if (closestDetails) {
      closestDetails.open = true;
    }
  }

  function scrollToTarget(target) {
    if (!target) return;

    const y =
      target.getBoundingClientRect().top +
      window.scrollY -
      HEADER_OFFSET;

    window.scrollTo({ top: y, behavior: "smooth" });
  }

  function handleHash(hash) {
    if (!hash) return;

    const target = document.querySelector(hash);
    if (!target) return;

    // 先に details を開く → 高さが変わることがあるから
    openDetailsInTarget(target);

    // 次にスクロール
    scrollToTarget(target);
  }

  // 1) ページ内リンク（#xxx）クリック：開いてスクロール、URLから # を消す
  document.addEventListener("click", (e) => {
    const link = e.target.closest && e.target.closest('a[href^="#"]');
    if (!link) return;

    const hash = link.getAttribute("href");
    if (!hash || hash === "#") return;

    const target = document.querySelector(hash);
    if (!target) return;

    e.preventDefault();
    handleHash(hash);

    // URLの # を消す（履歴は増やさない）
    history.replaceState(null, "", location.pathname + location.search);
  });

  // 2) 他ページから # 付きで来た場合：初回ロードで開いてスクロール、あとで # を消す
  window.addEventListener("load", () => {
    if (!location.hash) return;

    const hash = location.hash;
    const target = document.querySelector(hash);
    if (!target) return;

    // load 後に処理（iframeや画像でズレるのを軽減）
    handleHash(hash);

    // 少し待ってから # を消す
    setTimeout(() => {
      history.replaceState(null, "", location.pathname + location.search);
    }, 300);
  });
})();
</script>
