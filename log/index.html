<!doctype html>
<html lang="ja">
<head>
<script>
(function () {
  try {
    const saved = localStorage.getItem("theme");
    document.documentElement.dataset.theme =
      saved === "light" || saved === "dark" ? saved : "light";
  } catch (e) {
    document.documentElement.dataset.theme = "light";
  }
})();
</script>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>log | sunjour</title>
  <link rel="icon" href="/assets/images/favicon.png">
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="/assets/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">

<style>
.zoom-img {
  max-width: 100%;
  height: auto;
  cursor: zoom-in;
  transition: 0.2s ease;
}
.zoom-img.zoomed {
  position: fixed;
  inset: 0;
  margin: auto;
  max-width: 90vw;
  max-height: 90vh;
  width: auto;
  height: auto;
  z-index: 1000;
}

  .log-list p{
  font-family: "Noto Sans JP", sans-serif;
}

 .log-page {
  max-width: 760px;
  margin: 30px auto 80px;
  /* padding-top: 50px; */
}

.log-page h1 {
  margin-bottom: 0.5rem;
}

.log-lead {
  margin: 0 0 1.2rem;
  opacity: 0.72;
  font-size: 0.95rem;
  line-height: 1.8;
}

.log-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 1rem 0 1.4rem;
}

.tag-btn {
  border: 1px solid currentColor;
  background: transparent;
  color: inherit;
  padding: 0.35rem 0.72rem;
  border-radius: 999px;
  font: inherit;
  font-size: 0.86rem;
  line-height: 1.2;
  cursor: pointer;
  opacity: 0.68;
  transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease;
}

.tag-btn.is-active {
  opacity: 1;
}

.log-list {
  display: grid;
  gap: 30px;
}

.log-entry {
  margin: 0;
  padding: 20px;
  box-sizing: border-box;
  scroll-margin-top: 80px;
}

.log-entry:target {
  outline: 1px solid currentColor;
}

/* date + tag */

.log-meta {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px 12px;
  align-items: start;
  margin-bottom: 8px;
}

.log-date {
  margin: 0;
  font-size: 0.9rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  white-space: nowrap;
  text-align: right;
}

.entry-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 0;
  width: auto;
  min-width: 0;
  line-height: 1.2;
}

.entry-tags span {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.78rem;
  opacity: 0.85;
}

.log-body {
  font-size: 15px;
  line-height: 1.85;
  word-break: break-word;
}

.log-body > *:first-child {
  margin-top: 0;
}

.log-body > *:last-child {
  margin-bottom: 0;
}

.log-body p {
  margin: 0 0 0.7em;
  padding: 0;
  font-size: 15px;
}

.log-body p:last-child {
  margin-bottom: 0;
}

.log-body ul,
.log-body ol {
  margin: 0 0 0.9em 0.15em;
  padding-left: 1.2em;
}

.log-body li + li {
  margin-top: 0.3em;
}

.log-body strong {
  font-weight: 600;
}

.log-body a {
  color: inherit;
  text-underline-offset: 0.05em;
}

.log-body details {
  margin-top: 0.7rem;
  padding-top: 1rem;
}

.log-body summary {
  color: var(--muted);
}

.log-body img,
.log-list img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0.8rem auto;
  padding: 0;
  box-sizing: border-box;
}

/* action */

.log-actions {
  margin: 0.8rem 0 0;
  text-align: right;
}

.log-comment {
  font-size: 0.85rem;
  opacity: 0.72;
  text-decoration: none;
  border-bottom: 1px solid currentColor;
  padding-bottom: 1px;
}

.log-comment:hover {
  opacity: 1;
}

/* archive */

.log-archive {
  margin: 0 0 1rem;
}

.log-year-select {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  padding: 6px 14px;
  border: 1px solid currentColor;
  border-radius: 999px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 0.9rem;
  box-sizing: border-box;
}

@media (max-width: 640px) {
  .log-page {
    max-width: 100%;
    padding: 0 14px;
  }

  .log-filters {
    gap: 8px;
    margin: 0.9rem 0 1.3rem;
  }

  .tag-btn {
    padding: 0.32rem 0.68rem;
    font-size: 0.82rem;
  }

  .log-entry {
    padding: 18px;
  }

  .log-meta {
    gap: 6px 8px;
    margin-bottom: 7px;
  }

  .log-date {
    font-size: 0.84rem;
  }

  .entry-tags span {
    font-size: 0.74rem;
    padding: 2px 7px;
  }

  .log-body {
    font-size: 15px;
    line-height: 1.8;
  }

  .log-body p {
    font-size: 15px;
  }

  .log-body ul,
  .log-body ol {
    padding-left: 1.15em;
  }
}
    /* .log-entry {
  scroll-margin-top: 80px;
}

    .log-entry:target {
  outline: 1px solid currentColor;
} */

.log-entry.is-target {
  outline: 1px solid currentColor;
  outline-offset: 4px;
}
</style>

<body>
 <div id="siteHeader" data-include="/assets/header.html"></div>

<main class="page-enter log-page">
    <div class="log-archive">
  <!-- <label for="log-year" class="sr-only">archive</label> -->
  <select id="log-year" class="log-year-select">
     <option value="2026-01-04">2026.01-04</option>
  </select>
</div>

  <div id="tag-filters" class="log-filters"></div>
  <section id="log-list" class="log-list"></section>

</main>
<script type="module">
  function convertFold(md) {
    const match = md.split(/^###\s+/m);

    if (match.length < 2) return marked.parse(md);

    const before = match[0];
    const rest = match.slice(1).join('### ');

    const lines = rest.split('\n');
    const title = lines.shift().trim();
    const content = lines.join('\n');

    return (
      marked.parse(before) +
      `<details><summary class="cover__btn">${title}</summary>${marked.parse(content)}</details>`
    );
  }

  function scrollToHashTarget() {
    document.querySelectorAll('.log-entry.is-target').forEach(el => {
      el.classList.remove('is-target');
    });

    const hash = decodeURIComponent(location.hash);
    if (!hash) return;

    const targetId = hash.slice(1);
    const target = document.getElementById(targetId);
    if (!target) return;

    target.classList.add('is-target');

    target.scrollIntoView({
      behavior: 'auto',
      block: 'start'
    });
  }

  // ★追加：画像ラップ処理
  function wrapImages() {
    document.querySelectorAll('#log-list img').forEach(img => {
      if (img.closest('a')) return;

      const src = img.getAttribute('src');
      if (!src) return;

      const link = document.createElement('a');
      link.href = src;
      link.target = '_blank';
      link.rel = 'noopener';

      img.parentNode.insertBefore(link, img);
      link.appendChild(img);
    });
  }

  async function loadLogs(file) {
    const res = await fetch(file);

    if (!res.ok) {
      throw new Error(`${file} の読み込みに失敗`);
    }

    const raw = await res.text();

    const blocks = raw
      .split(/^##\s+/m)
      .map(block => block.trim())
      .filter(Boolean);

    const entries = blocks.map(block => {
      const lines = block.split('\n');

      const date = lines[0].trim();

      const tagLine = lines.find(line => line.startsWith('tags:'));
      const tags = tagLine
        ? tagLine
            .replace('tags:', '')
            .trim()
            .replace(/^\[/, '')
            .replace(/\]$/, '')
            .split(',')
            .map(tag => tag.trim())
            .filter(Boolean)
        : [];

      const body = lines
        .filter((line, i) => {
          if (i === 0) return false;
          if (line.startsWith('tags:')) return false;
          return true;
        })
        .join('\n')
        .trim();

      return { date, tags, body };
    });

    entries.sort(
      (a, b) =>
        new Date(b.date.replace(/\./g, '-')) -
        new Date(a.date.replace(/\./g, '-'))
    );

    renderLog(entries);
  }

  function renderLog(entries) {
    const logList = document.getElementById('log-list');
    const tagFilters = document.getElementById('tag-filters');

    const allTags = [...new Set(entries.flatMap(entry => entry.tags))];

    tagFilters.innerHTML = [
      `<button class="tag-btn is-active" data-tag="all">#all</button>`,
      ...allTags.map(
        tag => `<button class="tag-btn" data-tag="${tag}">#${tag}</button>`
      )
    ].join('');

    function renderEntries(selectedTag) {
      const filtered =
        selectedTag === 'all'
          ? entries
          : entries.filter(entry => entry.tags.includes(selectedTag));

      logList.innerHTML = filtered
        .map(
          entry => `
            <section class="card log-entry" id="${entry.date.replace(/\./g, '-')}">
              <div class="log-meta">
                ${
                  entry.tags.length
                    ? `
                  <p class="entry-tags">
                    ${entry.tags.map(tag => `<span>#${tag}</span>`).join('')}
                  </p>
                `
                    : ''
                }
                <h2 class="log-date">${entry.date}</h2>
              </div>

              <div class="log-body">
                ${convertFold(entry.body)}
              </div>

              <p class="log-actions">
                <a
                  class="log-comment"
                  href="/log/msg/?entry_date=${encodeURIComponent(entry.date)}&entry_tags=${encodeURIComponent(entry.tags.join(', '))}"
                >
                  comment
                </a>
              </p>
            </section>
          `
        )
        .join('');

      // ★ここが超重要
      wrapImages();

      scrollToHashTarget();
    }

    renderEntries('all');

    tagFilters.addEventListener('click', e => {
      const btn = e.target.closest('.tag-btn');
      if (!btn) return;

      document.querySelectorAll('.tag-btn').forEach(button => {
        button.classList.remove('is-active');
      });

      btn.classList.add('is-active');
      renderEntries(btn.dataset.tag);
    });
  }

  const yearSelect = document.getElementById('log-year');
  const params = new URLSearchParams(location.search);
  const archive = params.get('archive');

  let initialFile;

  if (archive) {
    initialFile = `/log/${archive}.md`;
    yearSelect.value = archive;
  } else {
    initialFile = `/log/${yearSelect.value}.md`;
  }

  loadLogs(initialFile).catch(err => {
    console.error(err);
    document.getElementById('log-list').innerHTML =
      `<p>logの読み込みに失敗しました。</p>`;
  });

  yearSelect.addEventListener('change', () => {
    const selected = yearSelect.value;

    history.replaceState(null, '', `?archive=${selected}${location.hash}`);

    loadLogs(`/log/${selected}.md`).catch(err => {
      console.error(err);
      document.getElementById('log-list').innerHTML =
        `<p>logの読み込みに失敗しました。</p>`;
    });
  });

  window.addEventListener('hashchange', () => {
    scrollToHashTarget();
  });
</script>
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/include.js"></script>
<script src="/assets/js/header.js"></script>

</body>
</html>
