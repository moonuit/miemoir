<script>
(function () {
  try {
    const saved = localStorage.getItem("theme");
    document.documentElement.dataset.theme =
      saved === "light" || saved === "dark" ? saved : "light";
  } catch (e) {
    document.documentElement.dataset.theme = "light";
  }
})();
</script>
